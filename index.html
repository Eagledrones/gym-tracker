<head>

<title>Gym Tracker</title>
<style>
/* Estilo «Atlético». --ac = acento para texto, líneas y figuras; --acf = relleno de botones (lima) con texto --onac. */
:root{--body:#2e2e2c;--body2:#8e8e88;--eq:#9b9b94;--eq2:#b5b5ae;--eq3:#8a8a84;--panel:#ececea;--fl:#d4d4d0;--bg:#f3f3f1;--card:#fff;--tx:#0f0f10;--mu:#6f6f75;--ac:#4d7c0f;--acf:#c6f135;--onac:#0a0a0b;--bd:#e6e6e3;--ok:#16a34a;--wa:#c27803;--er:#dc2626;--in:#4d7c0f;

:root[data-theme="dark"]{--body:#e2e2da;--body2:#7a7a73;--eq:#8b8b84;--eq2:#6a6a64;--eq3:#7a7a73;--panel:#1f1f22;--fl:#2c2c30;--bg:#0a0a0b;--card:#161618;--tx:#f5f5f4;--mu:#8d8d93;--ac:#c6f135;--acf:#c6f135;--onac:#0a0a0b;--bd:#26262b;--ok:#4ade80;--wa:#fbbf24;--er:#f87171;--in:#c6f135;--shoe:#4a4e55;--ol:rgba(0,0,0,.55);--sh:0 0 0 transparent;--glass:rgba(22,22,24,.9)}

.sbar.run #sesT{color:var(--ac)}
.sr{display:flex;gap:6px}
.sb{width:auto;margin:0;padding:11px 14px;white-space:nowrap}
.ghost.sb{color:var(--tx)}

.wheel::-webkit-scrollbar{display:none}
.wsp{height:104px}

.srow input::-webkit-inner-spin-button,.srow input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}

details.how{margin:4px 0 2px}

.wul{margin:8px 0 6px}
.wi{border-top:1px solid var(--bd);padding:6px 0}

.hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pfb{max-width:48%;padding:7px 12px;border:0;border-radius:99px;background:var(--card);box-shadow:var(--sh);color:var(--tx);font:inherit;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pfr{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--bd)}
.pfr input{flex:1;min-width:0}
.pfr .ghost{width:auto;padding:10px 12px}
.pfr .on{border-color:var(--ac);color:var(--ac)}
.bk{border-top:1px solid var(--bd);margin-top:14px;padding-top:12px}
.bkf{margin-top:8px;cursor:pointer;position:relative}
.bkf input{position:absolute;inset:0;opacity:0;cursor:pointer}
#bkT{display:block;width:100%;margin-top:8px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:12px/1.3 ui-monospace,monospace;resize:vertical}
.wcard{padding:12px 8px}
.greet{display:block;padding:0 6px 8px;text-transform:none}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.wd{background:none;border:0;padding:0;color:var(--tx);font:inherit;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.wl{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--mu)}
.wd.today .wl{color:var(--ac)}
.wc{position:relative;width:42px;height:42px;display:grid;place-items:center}
.ring{position:absolute;inset:0;width:100%;height:100%}
.rb{fill:none;stroke:var(--bd);stroke-width:4.5}
.rf{fill:none;stroke:var(--ac);stroke-width:4.5;stroke-linecap:round}
.wc b{position:relative;font-size:15px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
.wd.today .wc b{background:var(--acf);color:var(--onac)}
.wd.sel:not(.today) .wc b{background:var(--tx);color:var(--card)}
.wd.sel:not(.today) .wl{color:var(--tx)}
.tinfo a{color:var(--ac)}
.sw{position:relative;display:flex;align-items:center;gap:10px;margin:12px 0 0;padding:10px 12px;border:0;background:var(--panel);border-radius:14px;color:var(--tx);font-size:14px;font-weight:600;cursor:pointer}
.sw span{flex:1;min-width:0;display:flex;flex-direction:column}
.sw small{font-size:11.5px;font-weight:400;margin-top:2px}
.sw input{position:absolute;opacity:0;width:1px;height:1px;margin:0}

.sw i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:left .2s}
.sw input:checked~i{background:var(--ok)}

.sw input:focus-visible~i{outline:2px solid var(--ac);outline-offset:2px}
.sw b{flex:none;width:30px;font-size:13px;color:var(--mu)}
.sw input:checked~b{color:var(--ok)}
.wb{position:absolute;right:-5px;bottom:-5px;width:20px;height:20px;border-radius:50%;background:var(--card);border:1.5px solid var(--bd);display:grid;place-items:center;color:var(--mu)}
.wb.ok{background:var(--ok);border-color:var(--ok);color:var(--card)}
.tinfo{padding:12px 6px 2px;border-top:1px solid var(--bd);margin-top:12px}
.wsel{display:flex;gap:6px}
.wch{flex:1;margin:0;position:relative}
.wch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.wch span{display:block;text-align:center;padding:10px 0;border:1px solid transparent;border-radius:12px;font-weight:700;color:var(--mu);background:var(--panel)}
.wch input:checked+span{background:var(--acf);color:var(--onac)}
.wch input:focus-visible+span{outline:2px solid var(--ac);outline-offset:2px}
details.how summary{cursor:pointer;color:var(--ac);font-size:14px;font-weight:600;padding:4px 0}
.tag{display:inline-block;font-size:11px;font-weight:700;color:var(--ac);border:1px solid currentColor;border-radius:99px;padding:0 7px;margin-left:5px;vertical-align:1px}
.card.ss{box-shadow:inset 4px 0 0 var(--ac),var(--sh)}
.hint{display:block;margin-top:4px;font-size:12px}
#tmr{position:fixed;left:0;right:0;bottom:0;z-index:5;display:none;background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--bd);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(0,0,0,.08)}
body.hasT #tmr{display:block}
.ti{max-width:528px;margin:0 auto}
.tr1{display:flex;align-items:baseline;gap:10px;min-width:0}
#tT{font-size:34px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
#tN{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tmr.work #tT{color:var(--ac)}#tmr.rest #tT{color:var(--ok)}
.tp{height:4px;background:var(--bd);border-radius:2px;margin:8px 0;overflow:hidden}.tp i{display:block;height:100%;width:0;background:var(--acf)}
#tmr.rest .tp i{background:var(--ok)}

<body>
<main>
<div class="hd"><h1>🏋️ Gym Tracker</h1><button id="pfb" class="pfb" onclick="pOpen=!pOpen;pDel='';render()" aria-label="Cambiar de perfil"></button></div>
<div id="pf"></div>
<div class="tabs">
<button id="t1" onclick="st(1)">Plan</button>
<button id="t2" onclick="st(2)">Entrenar</button>
<button id="t3" onclick="st(3)">Revisión</button>
<button id="t4" onclick="st(4)">Progreso</button>
</div>
<div id="wk"></div>
<div id="m"></div>
<div id="v"></div>
</main>
<div id="tmr"></div>
<div id="sh"></div>
<script>
const K1="gymlog:v1",K2="gymplan:v2",K3="gymcfg:v1";
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
/* perfiles: hasta 3, cada uno con su plan e historial; el primero usa las claves originales (compatibilidad) */
const KP="gymprof:v1",PIDS=["p1","p2","p3"];
let prof=ld(KP,null)||{cur:"p1",list:[{id:"p1",n:"Perfil 1"}]},pOpen=false,pDel="";
const kOf=(k,id)=>id==="p1"?k:k+":"+id;
let log=ld(kOf(K1,prof.cur),[]),plan=ld(kOf(K2,prof.cur),null),cfg={work:40,rest:0,auto:true,snd:true,wake:true,...ld(K3,{})},tab=1,selDay=0,selEx="",rep=-1,ALT=[],edit=false;
const pinf=n=>P[EX[n].p.split(":")[0]];
const sv=()=>{try{localStorage.setItem(kOf(K1,prof.cur),JSON.stringify(log));localStorage.setItem(kOf(K2,prof.cur),JSON.stringify(plan))}catch(e){}};
const svp=()=>{try{localStorage.setItem(KP,JSON.stringify(prof))}catch(e){}};
const svc=()=>{try{localStorage.setItem(K3,JSON.stringify(cfg))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const dd=(a,b)=>Math.round((new Date(b+"T12:00")-new Date(a+"T12:00"))/864e5);
const fmt=s=>new Date(s+"T12:00").toLocaleDateString("es",{weekday:"short",day:"numeric",month:"short"});
/* unidad de peso del perfil: "lb" (por defecto) o "kg"; redondeo a 5 lb o 2,5 kg */
const UN=()=>(prof.list.find(p=>p.id===prof.cur)||{}).u||"lb";
const rnd=x=>{const q=UN()==="lb"?5:2.5;return Math.round(x/q)*q};
const wk=()=>Math.floor(dd(plan.start,today())/7);
const doneDay=(d,w)=>log.some(l=>d.ex.some(e=>e.n===l.ex)&&Math.floor(dd(plan.start,l.d)/7)===w);
/* superserie: e.ss=true enlaza el ejercicio con el siguiente; dentro de la cadena no hay descanso */
const inSS=(d,i)=>!!(d.ex[i].ss&&d.ex[i+1])||(i>0&&!!d.ex[i-1].ss);
const est=d=>Math.round((plan.wu!==false?5:2)+d.ex.reduce((a,e,i)=>a+exMin(e,inSS(d,i)),0));
function ssl(d){const o=[];let g=0;d.ex.forEach((e,i)=>{const p=i>0&&!!d.ex[i-1].ss;if(!p&&!(e.ss&&d.ex[i+1])){o.push("");return}if(!p)g++;o.push(String.fromCharCode(64+g)+(p?+o[i-1].slice(1)+1:1))});return o}

/* ===== Ilustraciones de ejercicios (figura lateral, dos posiciones) ===== */
const FL={sh:17,th:17,to:23,ua:12,fa:11,ft:7};
const dr=a=>[Math.cos(a*Math.PI/180),-Math.sin(a*Math.PI/180)];
const mv=(p,a,l)=>{const d=dr(a);return[p[0]+d[0]*l,p[1]+d[1]*l]};
const ad=(p,q,t)=>[p[0]+(q[0]-p[0])*t,p[1]+(q[1]-p[1])*t];
const pt=(p,x,y)=>[p[0]+x,p[1]+y];
const R1=n=>(Math.round(n*10)/10);
const PS=p=>R1(p[0])+","+R1(p[1]);
function ik(h,a,l1,l2,sg){
  const dx=a[0]-h[0],dy=a[1]-h[1],dr_=Math.hypot(dx,dy)||1,d=Math.min(dr_,l1+l2-.05),ux=dx/dr_,uy=dy/dr_;
  const x=(l1*l1-l2*l2+d*d)/(2*d),y=Math.sqrt(Math.max(0,l1*l1-x*x));
  const c1=[h[0]+ux*x-uy*y,h[1]+uy*x+ux*y],c2=[h[0]+ux*x+uy*y,h[1]+uy*x-ux*y];
  const knee=(c1[0]>c2[0])===(sg>0)?c1:c2;
  return{k:knee,a:[h[0]+ux*d,h[1]+uy*d]};
}
function fk(f){
  const K=f.k||1,L={};for(const n in FL)L[n]=FL[n]*K;
  let a,k,hp,s,e,w,a2,k2;
  if(f.sp){
    /* colgado con hombro fijo (sp) y mano en un punto (W): el cuerpo cuelga del hombro y el brazo se resuelve por IK,
       así al animar el hombro sube en línea recta bajo la barra (dominadas) */
    s=f.sp;hp=mv(s,f.to+180,L.to);k=mv(hp,f.th+180,L.th);a=mv(k,f.sh+180,L.sh);
    const r=ik(s,f.W,L.ua,L.fa,f.asg||1);e=r.k;w=r.a;
  }else if(f.wp){
    w=f.wp;e=mv(w,f.fa+180,L.fa);s=mv(e,f.ua+180,L.ua);hp=mv(s,f.to+180,L.to);
    k=mv(hp,f.th+180,L.th);a=mv(k,f.sh+180,L.sh);
  }else{
    if(f.hp&&f.A){hp=f.hp;const r=ik(hp,f.A,L.th,L.sh,f.sg||1);k=r.k;a=r.a;
      if(f.A2){const r2=ik(hp,f.A2,L.th,L.sh,f.sg||1);k2=r2.k;a2=r2.a}}
    else if(f.hp){hp=f.hp;k=mv(hp,f.th+180,L.th);a=mv(k,f.sh+180,L.sh)}
    else{a=f.o;k=mv(a,f.sh,L.sh);hp=mv(k,f.th,L.th)}
    s=mv(hp,f.to,L.to);e=mv(s,f.ua,L.ua);w=mv(e,f.fa,L.fa);
  }
  const hd=f.hd??f.to,e2=f.ua2!=null?mv(s,f.ua2,L.ua):null,w2=e2?mv(e2,f.fa2??f.ua2,L.fa):null;   // brazo lejano opcional (ua2/fa2)
  return{K,a,k,hp,s,e,w,e2,w2,k2,a2,to:f.to,t:mv(a,f.ft??0,L.ft),t2:a2?mv(a2,f.ft2??f.ft??0,L.ft):null,h:mv(s,hd,9.2*K),nk:mv(s,hd,3.5*K),hd};
}
function limb(p,q,w1,w2,c){
  const dx=q[0]-p[0],dy=q[1]-p[1],d=Math.hypot(dx,dy)||1,nx=-dy/d,ny=dx/d;
  const a=[p[0]+nx*w1/2,p[1]+ny*w1/2],b=[q[0]+nx*w2/2,q[1]+ny*w2/2],cc=[q[0]-nx*w2/2,q[1]-ny*w2/2],dd=[p[0]-nx*w1/2,p[1]-ny*w1/2];
  return`<g fill="${c}"><polygon points="${PS(a)} ${PS(b)} ${PS(cc)} ${PS(dd)}"/><circle cx="${R1(p[0])}" cy="${R1(p[1])}" r="${R1(w1/2)}"/><circle cx="${R1(q[0])}" cy="${R1(q[1])}" r="${R1(w2/2)}"/></g>`;
}
const ln=(p,q,w,c,da)=>`<line x1="${R1(p[0])}" y1="${R1(p[1])}" x2="${R1(q[0])}" y2="${R1(q[1])}" stroke="${c||"var(--eq)"}" stroke-width="${w||1.6}" stroke-linecap="round"${da?` stroke-dasharray="${da}"`:""}/>`;
const circ=(p,r,fill,stroke,sw)=>`<circle cx="${R1(p[0])}" cy="${R1(p[1])}" r="${r}" fill="${fill||"none"}"${stroke?` stroke="${stroke}" stroke-width="${sw||1.4}"`:""}/>`;
const FRONT=["plate","db","grip","bandh"];
function prim(x){
  const t=x[0];
  if(t==="bench"||t==="pad"){const A=Array.isArray(x[1]),p=A?x[1]:[x[1],x[2]],q=A?x[2]:[x[3],x[4]],w=A?x[3]:x[5];return limb(p,q,w,w,t==="pad"?"var(--eq2)":"var(--eq)")}
  if(t==="plate")return circ(x[1],x[2],"var(--eq)")+circ(x[1],x[2]*.3,"var(--panel)")+circ(x[1],x[2],"none","var(--eq3)",.8);
  if(t==="db")return limb(pt(x[1],0,-3.4),pt(x[1],0,3.4),3.4,3.4,"var(--eq)")+limb(pt(x[1],-2,0),pt(x[1],2,0),2,2,"var(--eq)");
  if(t==="grip")return circ(x[1],2.4,"var(--eq)");
  if(t==="line")return ln(x[1],x[2],x[3]||1.6);
  if(t==="cable")return ln(x[1],x[2],.9,"var(--eq3)");
  if(t==="band")return ln(x[1],x[2],1.5,"var(--ac)","2.4 1.6");
  if(t==="bandh")return ln(x[1],x[2],1.5,"var(--ac)","2.4 1.6");
  if(t==="pulley")return circ(x[1],2.6,"var(--panel)","var(--eq)",1.3);
  if(t==="rect")return`<rect x="${x[1]}" y="${x[2]}" width="${x[3]}" height="${x[4]}" rx="1.2" fill="var(--eq2)"/>`;
  if(t==="post")return ln([x[1],x[2]],[x[1],x[3]],x[4]||2);
  return"";
}
function muscle(m,J,n){
  const K=J.K,seg=(p,q,w1,w2)=>limb(p,q,w1*K,w2*K,"var(--ac)");
  switch(m){
    case"chest":return seg(pt(ad(J.s,J.hp,.1),n[0]*2.8*K,n[1]*2.8*K),pt(ad(J.s,J.hp,.4),n[0]*2.8*K,n[1]*2.8*K),5.6,5.6);
    case"back":return seg(pt(ad(J.s,J.hp,.14),-n[0]*1.6*K,-n[1]*1.6*K),pt(ad(J.s,J.hp,.58),-n[0]*1.6*K,-n[1]*1.6*K),5.6,5.2);
    case"core":return seg(pt(ad(J.s,J.hp,.55),n[0]*2.6*K,n[1]*2.6*K),pt(ad(J.s,J.hp,.95),n[0]*2.6*K,n[1]*2.6*K),5.4,5.2);
    case"shoulder":return circ(pt(J.s,n[0]*.8,n[1]*.8),3.9*K,"var(--ac)");
    case"arm":return seg(ad(J.s,J.e,.1),ad(J.s,J.e,.95),3.8,3.2);
    case"quad":case"ham":return seg(ad(J.hp,J.k,.14),ad(J.hp,J.k,.86),5.8,4.4);
    case"glute":return circ(J.hp,4.1*K,"var(--ac)")+seg(J.hp,ad(J.hp,J.k,.4),5.4,5);
    case"calf":return seg(ad(J.k,J.a,.12),ad(J.k,J.a,.8),3.8,2.8);
  }
  return"";
}
/* estilo de la figura: piel, camiseta, short y zapatillas. Cada capa se dibuja primero algo más gruesa en el color de
   contorno y luego encima en su color, así las piezas de una misma capa se funden en una silueta con borde. */
const SK={sk:"var(--skin)",sk2:"var(--skin2)",sh:"var(--shirt)",sh2:"var(--shirt2)",so:"var(--short)",so2:"var(--short2)",fo:"var(--shoe)",hr:"var(--hair)",ol:"var(--ol)"};
function lay(parts,ow){
  const one=(x,o)=>{const c=o?SK.ol:x[x.length-1];
    if(x[0]==="l")return limb(x[1],x[2],x[3]+o,x[4]+o,c);
    if(x[0]==="c")return circ(x[1],R1(x[2]+o/2),c);
    if(x[0]==="e")return`<ellipse cx="${R1(x[1][0])}" cy="${R1(x[1][1])}" rx="${R1(x[2]+o/2)}" ry="${R1(x[3]+o/2)}" fill="${c}" transform="rotate(${R1(x[4])} ${R1(x[1][0])} ${R1(x[1][1])})"/>`;
    if(x[0]==="p")return`<polygon points="${x[1]}" fill="${c}"${o?` stroke="${c}" stroke-width="${o}" stroke-linejoin="round"`:""}/>`;
    return""};
  return parts.map(x=>one(x,ow)).join("")+parts.map(x=>one(x,0)).join("");
}
/* cabeza de perfil: pelo atrás y arriba, cara hacia delante y oreja */
/* cabeza de perfil: el cráneo entero va en color de pelo y la cara (más pequeña, adelantada y hacia abajo) se dibuja
   encima, así el pelo cubre la parte de arriba y la de atrás; flequillo sobre la frente y oreja */
function headSide(h,hd,K,O){
  const up=dr(hd),fw=dr(hd-90),rot=-(hd-90),at=(u,f)=>pt(h,(up[0]*u+fw[0]*f)*K,(up[1]*u+fw[1]*f)*K);
  return lay([["e",at(.2,-.2),5.1*K,5.8*K,rot,SK.hr],["e",at(-1.1,1.05),4.35*K,4.75*K,rot,SK.sk]],O)
    +lay([["e",at(3.1,1.9),2.7*K,1.35*K,rot-28,SK.hr]],0)
    +circ(at(-.7,-.5),R1(1.25*K),SK.sk2);
}
function drawSide(J,f,v){
  const K=J.K,d=[-1.8,-.9],sh=p=>pt(p,d[0],d[1]),O=1.2*K;
  const E=f.eq?f.eq(J,v):[];
  let o=E.filter(x=>!FRONT.includes(x[0])).map(prim).join("");
  const k2=J.k2||J.k,a2=J.a2||J.a,t2=J.t2||J.t,fd=J.a2?p=>p:sh,e2=J.e2||J.e,w2=J.w2||J.w;
  const n=dr(J.to-90),F=(p,s)=>pt(p,n[0]*s*K,n[1]*s*K);   // n apunta hacia el pecho
  /* brazo y pierna lejanos, un tono más oscuro */
  o+=lay([["l",fd(J.s),fd(e2),5.2*K,4.4*K,SK.sk2],["l",fd(e2),fd(w2),4.4*K,3.2*K,SK.sk2],["c",fd(w2),2.5*K,SK.sk2]],O);
  o+=lay([["l",fd(J.hp),fd(k2),8.8*K,6.2*K,SK.sk2],["l",fd(k2),fd(a2),6*K,3.8*K,SK.sk2],["l",fd(a2),fd(t2),5*K,3.6*K,SK.fo],["l",fd(J.hp),fd(ad(J.hp,k2,.6)),10*K,8.6*K,SK.so2]],O);
  /* torso con pecho algo adelantado, cadera con short, pierna cercana, cuello */
  const ch=F(ad(J.s,J.hp,.3),.9),wa=F(ad(J.s,J.hp,.72),.2);
  o+=lay([["l",J.hp,J.k,9.4*K,6.6*K,SK.sk],["l",J.k,J.a,6.4*K,4*K,SK.sk],["l",J.a,J.t,5.2*K,3.8*K,SK.fo],["l",J.s,J.nk,4.8*K,4.4*K,SK.sk],
    ["l",J.s,ch,12.6*K,13.4*K,SK.sh],["l",ch,wa,13.4*K,11*K,SK.sh],["l",wa,J.hp,11*K,11.8*K,SK.sh],
    ["l",ad(J.s,J.hp,.86),J.hp,12*K,12.2*K,SK.so],["l",J.hp,ad(J.hp,J.k,.62),10.8*K,9*K,SK.so]],O);
  /* brazo cercano con su propio contorno para separarlo del torso; si va por encima del hombro (dominadas, press
     por encima de la cabeza, colgados) la cabeza se dibuja delante para que no quede tapada */
  const arm=lay([["c",J.s,3.4*K,SK.sk],["l",J.s,J.e,6*K,5*K,SK.sk],["l",J.e,J.w,5*K,3.6*K,SK.sk],["c",J.w,2.7*K,SK.sk]],O),hd=headSide(J.h,J.hd,K,O);
  o+=J.e[1]<J.s[1]-2*K?arm+hd:hd+arm;
  o+=`<g opacity=".88">${(f.mu||[]).map(m=>muscle(m,J,n)).join("")}</g>`;
  o+=E.filter(x=>FRONT.includes(x[0])).map(prim).join("");
  return o;
}
/* ---- vista frontal (elevaciones laterales, círculos de hombro) ---- */
function drawFront(f,v){
  const s1=[38,26],s2=[62,26],O=1.2;
  const arm=(s,ua,fa)=>{const e=mv(s,ua,12),w=mv(e,fa,11);return{e,w}};
  const A1=arm(s1,f.l[0],f.l[1]),A2=arm(s2,f.r[0],f.r[1]);
  let o=lay([["l",[44,50],[42.5,75],9.4,6,SK.sk],["l",[56,50],[57.5,75],9.4,6,SK.sk],["l",[42.5,75.2],[38.6,76.2],5,3.8,SK.fo],["l",[57.5,75.2],[61.4,76.2],5,3.8,SK.fo],
    ["l",[44.2,48],[43.6,60],11.2,9.8,SK.so],["l",[55.8,48],[56.4,60],11.2,9.8,SK.so],["l",[50,18],[50,24],4.6,4.6,SK.sk],
    ["p","38,23.5 62,23.5 59,40 58.5,50 41.5,50 41,40",SK.sh]],O);
  o+=lay([["e",[50,13.2],5.5,6.2,0,SK.hr],["e",[50,15.3],4.6,4.9,0,SK.sk]],O)+lay([["e",[47.6,11.6],2.9,1.4,-14,SK.hr]],0)+circ([45.4,15.2],1.2,SK.sk2)+circ([54.6,15.2],1.2,SK.sk2);
  [[s1,A1],[s2,A2]].forEach(([s,A])=>{o+=lay([["c",s,4,SK.sk],["l",s,A.e,5.6,4.8,SK.sk],["l",A.e,A.w,4.8,3.6,SK.sk],["c",A.w,2.6,SK.sk]],O)});
  (f.mu||[]).forEach(m=>{if(m==="shoulder"){o+=`<g opacity=".88">`+circ(s1,3.4,"var(--ac)")+circ(s2,3.4,"var(--ac)")+limb(s1,ad(s1,A1.e,.7),3.8,3.4,"var(--ac)")+limb(s2,ad(s2,A2.e,.7),3.8,3.4,"var(--ac)")+`</g>`}});
  if(v==="db"){[A1.w,A2.w].forEach(w=>{o+=limb(pt(w,-3.2,0),pt(w,3.2,0),3.6,3.6,"var(--eq)")+limb(pt(w,0,-2.2),pt(w,0,2.2),2,2,"var(--eq)")})}
  else if(v==="band"){o+=ln(A1.w,[44,76],1.4,"var(--ac)","2.4 1.6")+ln(A2.w,[56,76],1.4,"var(--ac)","2.4 1.6")}
  return{o,A1,A2};
}

/* figura (cuerpo + equipo) para una pose cualquiera, incluidas las intermedias de la animación */
function figG(p,f,v,idx){
  if(p.front)return drawFront({...f,mu:p.m},v).o;
  const J=fk(f);return drawSide(J,{...f,mu:p.m},v)+(p.ov?p.ov(J,idx):"");
}
/* pose intermedia entre inicio (t=0) y final (t=1): ángulos por el camino más corto; los objetivos de pie (A/A2)
   en coordenadas polares respecto a la cadera para que la pierna no se doble a mitad del movimiento */
const ANG=["sh","th","to","ua","fa","ft","ft2","hd","ua2","fa2"];
const angL=(a,b,t)=>a+(((b-a)%360+540)%360-180)*t;
const pol=(h,p)=>[Math.atan2(h[1]-p[1],p[0]-h[0])*180/Math.PI,Math.hypot(p[0]-h[0],p[1]-h[1])];
function lerpPose(a,b,t){
  const A={...a,hd:a.hd??a.to},B={...b,hd:b.hd??b.to},o={...(t<.5?A:B)};
  [["ua2","ua"],["fa2","fa"],["ft2","ft"]].forEach(([x,y])=>{if(A[x]==null&&B[x]!=null)A[x]=A[y]??0;if(B[x]==null&&A[x]!=null)B[x]=B[y]??0});
  ANG.forEach(k=>{if(A[k]!=null&&B[k]!=null)o[k]=angL(A[k],B[k],t)});
  ["o","hp","wp","sp","W"].forEach(k=>{if(A[k]&&B[k])o[k]=[0,1].map(i=>A[k][i]+(B[k][i]-A[k][i])*t)});
  ["A","A2"].forEach(k=>{if(A[k]&&B[k]){const x=pol(A.hp,A[k]),y=pol(B.hp,B[k]);o[k]=mv(o.hp,angL(x[0],y[0],t),x[1]+(y[1]-x[1])*t)}});
  ["l","r"].forEach(k=>{if(A[k]&&B[k])o[k]=[0,1].map(i=>angL(A[k][i],B[k][i],t))});
  if(A.k!=null||B.k!=null)o.k=(A.k||1)+((B.k||1)-(A.k||1))*t;
  return o;
}
/* animación en bucle inicio → final → inicio con 12 fotogramas que se alternan por CSS (sin JavaScript en marcha) */
const NF=12;
function figAnim(key){
  const[base,v]=key.split(":"),p=P[base],fl=p.nf?"":`<line x1="6" y1="77.6" x2="94" y2="77.6" stroke="var(--fl)" stroke-width="1.2" stroke-linecap="round"/>`;
  let g="";
  for(let i=0;i<NF;i++){const t=(1-Math.cos(2*Math.PI*i/NF))/2;g+=`<g class="af${i===NF/2?" key":""}" style="animation-delay:-${(((NF-i)%NF)*2.6/NF).toFixed(3)}s">${figG(p,lerpPose(p.f[0],p.f[1],t),v,t<.5?0:1)}</g>`}
  return`<svg viewBox="0 0 100 80" class="fig anim" role="img" aria-label="Animación del ejercicio"><rect width="100" height="80" rx="7" fill="var(--panel)"/>${fl}${g}</svg>`;
}
function panel(key,idx,dx){
  const [base,v]=key.split(":"),p=P[base],f=p.f[idx];
  let g;
  if(p.front)g=figG(p,f,v,idx);
  else{
    const J=fk(f);
    g=figG(p,f,v,idx);
    if(idx===1&&p.tr){
      const J0=fk(p.f[0]),a=J0[p.tr==="a"?"a":p.tr==="s"?"s":p.tr==="k"?"k":p.tr==="hp"?"hp":"w"],b=J[p.tr==="a"?"a":p.tr==="s"?"s":p.tr==="k"?"k":p.tr==="hp"?"hp":"w"];
      const d=Math.hypot(b[0]-a[0],b[1]-a[1]);
      if(d>6){const u=[(b[0]-a[0])/d,(b[1]-a[1])/d],nn=[-u[1],u[0]],tip=b,bs=[b[0]-u[0]*4.5,b[1]-u[1]*4.5];
        g+=ln(a,bs,1.4,"var(--ac)","2.2 1.8")+`<polygon points="${PS(tip)} ${PS([bs[0]+nn[0]*2.4,bs[1]+nn[1]*2.4])} ${PS([bs[0]-nn[0]*2.4,bs[1]-nn[1]*2.4])}" fill="var(--ac)"/>`}
    }
  }
  const fl=p.nf?"":`<line x1="6" y1="77.6" x2="94" y2="77.6" stroke="var(--fl)" stroke-width="1.2" stroke-linecap="round"/>`;

/* ---------- Recomendaciones semanales (progresión doble + tendencia de 3 sesiones) ---------- */
const inc=e=>UN()==="lb"?(e.l?10:5):(e.l?5:2.5);
const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
/* últimas k sesiones de un ejercicio, la más reciente primero; cada sesión = series de una fecha */
function hist(n,k){const by={};log.forEach(l=>{if(l.ex===n)(by[l.d]=by[l.d]||[]).push(l)});return Object.keys(by).sort().reverse().slice(0,k).map(d=>by[d])}

const score=(e,s)=>e.bw?s.reduce((a,l)=>a+l.r*(1+l.w/40),0):Math.max(...s.map(l=>l.w*(1+l.r/30)));

const canDo=n=>EX[n].q.every(q=>(plan?plan.eq:[]).includes(q));

const easy=s=>s.length>0&&s.every(a=>a.x===1);

    if(top)return nx?{k:"up",t:"Siguiente progresión",m:"Completaste "+n+"×"+e.hi+u+". Pasa a «"+nx+"» y empieza en "+e.lo+u+".",nx,r:e.lo,w:e.w}
      :{k:"up",t:"Más dificultad",m:"Completaste "+n+"×"+e.hi+u+". Hazlo más difícil (tempo lento, pausa o lastre) y vuelve a "+e.lo+u+".",r:e.lo,w:e.w};
    if(t&&(t.stall||t.drop))return{k:"deload",t:"Descarga",m:(t.stall?"Tres sesiones sin mejorar.":"Rendimiento a la baja dos sesiones seguidas.")+" Haz una semana suave con "+Math.max(1,e.s-1)+" series lejos del fallo"+(pv?" o practica «"+pv+"»":"")+" y retoma.",r:e.lo,w:e.w};
    if(av<e.lo&&pv)return{k:"down",t:"Progresión más fácil",m:"Promedio de "+av.toFixed(1)+u+", por debajo de "+e.lo+". Vuelve a «"+pv+"» hasta dominar "+e.hi+u+".",pv,r:e.lo,w:e.w};

  if(t&&t.stall){const w=Math.max(0,rnd(mx*.9));return{k:"deload",t:"Descarga",m:"Tres sesiones sin mejorar tu 1RM estimado. Baja a "+w+un+" una semana, haz "+e.s+"×"+e.lo+" sin llegar al fallo y vuelve a progresar desde ahí.",w,r:e.lo}}

}

const WD=["L","M","X","J","V","S","D"],WDN=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const DEFD={2:[0,3],3:[0,2,4],4:[0,1,3,4],5:[0,1,2,3,4]};
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const wdOf=s=>(new Date(s+"T12:00").getDay()+6)%7;   // 0 = lunes
const wdays=()=>(plan.days&&plan.days.length?plan.days:DEFD[plan.nd]||[]).slice().sort((a,b)=>a-b);
/* día del plan asignado a una fecha (-1 = descanso) */
function sched(s){const k=wdays().indexOf(wdOf(s));return k>=0&&k<plan.list.length?k:-1}
/* estado de una fecha: si ese día hubo series, el día del plan que más coincide; p = series hechas / previstas */
function dayStat(s){
  const L=log.filter(l=>l.d===s);let k=sched(s);
  if(L.length){let bn=0;plan.list.forEach((d,i)=>{const c=d.ex.filter(e=>L.some(l=>l.ex===e.n)).length;if(c>bn){bn=c;k=i}})}
  if(k<0)return{k,p:0,done:L.length>0};
  const d=plan.list[k],tot=d.ex.reduce((a,e)=>a+e.s,0),n=d.ex.reduce((a,e)=>a+Math.min(e.s,L.filter(l=>l.ex===e.n).length),0);
  return{k,p:tot?n/tot:0,done:L.length>0};
}

function fillAnim(el){const d=el.querySelector(".anh");if(d&&!d.innerHTML)d.innerHTML=figAnim(d.dataset.k)}
function wuStart(){

/* avanza el calentamiento; devuelve true si lo gestionó */
function wuNext(){

  if(q.i<q.s.length){beep(1);const x=q.s[q.i];clk.dur=x.sec;clk.end=Date.now()+x.sec*1000;clk.note="Calentamiento "+(q.i+1)+"/"+q.s.length+" · "+x.n}

function vTrain(){

/* ---------- Sesión: cronómetro del entrenamiento completo (iniciar / pausa / terminar) ---------- */
const KD="gymdur:v1",KN="gymnotes:v1";
let durs=ld(kOf(KD,prof.cur),[]),notes=ld(kOf(KN,prof.cur),{}),sOk=false;   // sOk: pidiendo confirmación para terminar
const svd=()=>{try{localStorage.setItem(kOf(KD,prof.cur),JSON.stringify(durs))}catch(e){}};
const svn=()=>{try{localStorage.setItem(kOf(KN,prof.cur),JSON.stringify(notes))}catch(e){}};
const ses=()=>cfg.ses&&cfg.ses.p===prof.cur?cfg.ses:null;
const sEl=s=>s.acc+(s.t0?Date.now()-s.t0:0);
const hms=ms=>{const t=Math.floor(ms/1000),h=Math.floor(t/3600),m=Math.floor(t/60)%60,x=t%60;return(h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0")};
/* última duración registrada del mismo día del plan */
const lastDur=d=>{for(let i=durs.length-1;i>=0;i--)if(durs[i].n===d.name)return durs[i];return null};
const durTxt=r=>hms(r.s*1000)+" ("+fmt(r.d)+")";
function setsDone(k){const d=dayOf(k),L=log.filter(l=>l.d===today());let n=0,t=0;blocks(d).forEach(b=>{const s=Math.max(...b.map(j=>baseLen(d.ex[j])));b.forEach(j=>{t+=s;n+=Math.min(s,L.filter(l=>l.ex===d.ex[j].n).length)})});return[n,t]}
function vSes(k){
  const s=ses(),d=plan.list[s&&plan.list[s.k]?s.k:k],run=!!(s&&s.t0),[n,t]=setsDone(k),lr=lastDur(d);
  const btn=!s?`<button class="add sb" onclick="sesGo()">▶ Iniciar</button>`
    :sOk?`<button class="add sb" style="background:var(--er)" onclick="sesStop()">Terminar</button><button class="ghost sb" onclick="sOk=false;updSes()">No</button>`
    :(run?`<button class="ghost sb" onclick="sesPause()">⏸ Pausa</button>`:`<button class="add sb" onclick="sesGo()">▶ Seguir</button>`)+`<button class="ghost sb" onclick="sOk=true;updSes()" aria-label="Terminar sesión">■ Fin</button>`;
  return`<div class="sbar${run?" run":""}"><div class="sl"><small>${esc(d.name)}${s&&!run?" · en pausa":""}</small><b id="sesT">${s?hms(sEl(s)):"0:00"}</b><small>${sOk?"¿Terminar y guardar la sesión?":lr?"Última vez: "+durTxt(lr):"Pulsa Iniciar para medir la sesión"}</small></div><div class="sr">${btn}</div><div class="sp"><i style="width:${t?n/t*100:0}%"></i></div><small class="sc">${n}/${t}</small></div>`;
}
const updSes=()=>{const b=document.querySelector(".sbar");if(b&&tab===2&&!vDay)b.outerHTML=vSes(selDay)};
function sesGo(){unlock();const s=ses();if(!s)cfg.ses={p:prof.cur,d:today(),k:selDay,acc:0,t0:Date.now()};else if(!s.t0)s.t0=Date.now();sOk=false;svc();updSes()}
function sesPause(){const s=ses();if(!s||!s.t0)return;s.acc+=Date.now()-s.t0;s.t0=null;svc();updSes()}
function sesStop(){
  const s=ses();if(!s)return;
  const ms=sEl(s),k=plan.list[s.k]?s.k:selDay,[n]=setsDone(k);
  if(ms>=60000){durs.push({d:s.d,n:plan.list[k].name,s:Math.round(ms/1000),sets:n});svd()}
  cfg.ses=null;sOk=false;svc();updSes();updWeek();
  say("Sesión terminada: "+hms(ms)+" · "+n+" series"+(ms<60000?" (menos de 1 min, no se guardó)":""));
}
setInterval(()=>{const s=ses(),T=$("sesT");if(s&&s.t0&&T)T.textContent=hms(sEl(s))},1000);

/* ---------- Tarjeta de ejercicio: una por ejercicio o una por superserie (filas 1A, 1B, 2A…) ---------- */
let MENU=-1;const HOW=new Set(),COL=new Set();
function blocks(d){const B=[];d.ex.forEach((e,i)=>{if(i>0&&d.ex[i-1].ss)B[B.length-1].push(i);else B.push([i])});return B}
/* descanso entre series (e.rest) y entre ejercicios (e.rx) del bloque que empieza en h; 1 min por defecto */
const restOf=h=>{const e=curEx(h);return e.rest!=null?e.rest:REST0};
const restExOf=h=>{const e=curEx(h);return e.rx!=null?e.rx:REST0};
const noteOf=n=>notes[today()+"|"+n]||"";
const prevNote=n=>{const k=Object.keys(notes).filter(k=>k.endsWith("|"+n)&&k.slice(0,10)<today()).sort().pop();return k?notes[k]:""};
function setNote(i,v){const k=today()+"|"+curEx(i).n;v=v.trim();if(v)notes[k]=v;else delete notes[k];svn()}
const ARU='<svg viewBox="0 0 12 14" aria-label="sube"><path d="M2 7l4-4 4 4M2 12l4-4 4 4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ARD='<svg viewBox="0 0 12 14" aria-label="baja"><path d="M2 2l4 4 4-4M2 7l4 4 4-4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function exHead(e,i,letter,first,col,R){
  const done=R.filter(Boolean).length,pn=prevNote(e.n);
  return`<div class="eh"><button class="eth" onclick="tgHow(${i})" aria-label="Cómo se hace ${esc(e.n)}">${figEnd(EX[e.n].p)}</button><div class="en"><button class="exn" onclick="tgHow(${i})">${esc(e.n)}</button><small>${e.lo}-${e.hi}${e.t?" s":" reps"}${e.tr?" · meta "+e.tr:""}${!e.bw&&e.w?" · "+e.w+" "+UN():""}${col?" · "+done+"/"+R.length+" series":""}</small>${e.f?'<span class="tag" style="margin-left:0">enfoque</span>':""}${(ovrOf(selDay)||{})[i]?'<span class="tag" style="margin-left:0">solo hoy</span>':""}</div>${letter?`<b class="ltr">${letter}</b>`:""}<button class="ib" onclick="MENU=MENU===${i}?-1:${i};render()" aria-label="Opciones de ${esc(e.n)}">⋮</button>${first?`<button class="ib" onclick="tgCol(${i})" aria-label="${col?"Expandir":"Contraer"}">${col?"⌄":"⌃"}</button>`:""}</div>`
  +(MENU===i?menuH(e,i):"")
  +(HOW.has(i)&&!col?`<div class="howp">${figBoth(EX[e.n].p)}<small class="cue">${pinf(e.n).c}</small></div>`:"")
  +(col?"":`<label class="note">✎<input value="${esc(noteOf(e.n))}" placeholder="${esc(pn?"Nota anterior: "+pn:"Añadir notas…")}" maxlength="140" aria-label="Notas de ${esc(e.n)}" onchange="setNote(${i},this.value)"></label>`);
}
function menuH(e,i){
  const nx=curEx(i+1),url="https://www.youtube.com/results?search_query="+encodeURIComponent(e.n+" técnica");
  return`<div class="menu"><button onclick="tgHow(${i})">${HOW.has(i)?"Ocultar":"Ver"} cómo se hace</button><a href="${url}" target="_blank" rel="noopener" onclick="MENU=-1">Ver técnica en YouTube ↗</a><button onclick="MENU=-1;openRep(${i})">Cambiar ejercicio</button>${nx?`<button onclick="MENU=-1;tgSS(${i})">${e.ss?"Quitar superserie con el siguiente":"🔗 Hacer superserie con el siguiente"}</button>`:""}</div>`;
}
const tgHow=i=>{HOW.has(i)?HOW.delete(i):HOW.add(i);MENU=-1;render()};
const tgCol=i=>{const n=curEx(i).n;COL.has(n)?COL.delete(n):COL.add(n);render()};
function vBlock(d,b,first){
  const h=b[0],ss=b.length>1,col=COL.has(d.ex[h].n),RS=b.map(i=>rowsOf(d.ex[i])),PV=b.map(i=>prevS(d.ex[i].n));
  let o=`<div class="card ex" id="c${h}">`;
  b.forEach((i,bk)=>{o+=exHead(d.ex[i],i,ss?String.fromCharCode(65+bk):"",bk===0,col,RS[bk])});
  b.forEach(i=>{if(rep===i)o+=repPanel(i)});
  if(col)return o+`</div>`;
  const allT=b.every(i=>d.ex[i].t);
  o+=`<div class="srow sh"><span>SERIE</span><span>ANTERIOR</span><span style="grid-column:span 2">${UN().toUpperCase()}</span><span style="grid-column:span 2">${allT?"SEG":"REPS"}</span><span>ESFUERZO</span></div>`;
  const n=Math.max(...RS.map(r=>r.length));
  for(let r=0;r<n;r++)b.forEach((i,bk)=>{if(r<RS[bk].length)o+=rowH(i,r,d.ex[i],RS[bk][r],PV[bk],RS[bk],(r+1)+(ss?String.fromCharCode(65+bk):""),ss&&bk%2===1)});
  if(first)o+=`<small class="hint">Toca el círculo y elige el esfuerzo (<i class="dot fx1"></i> fácil · <i class="dot fx2"></i> medio · <i class="dot fx3"></i> difícil): la serie se guarda y empieza el descanso.</small>`;
  b.forEach(i=>{const e=d.ex[i],free=RS[b.indexOf(i)].findIndex(l=>!l),g=e.tr||e.hi;if(e.t&&free>=0)o+=`<button class="ghost" style="margin-top:10px" onclick="tStart('work',${g},[${i},${free}],'${esc(e.n)} · serie ${free+1} · ${g} s')">⏱ Cronometrar serie ${free+1} de ${esc(e.n)} (${g} s)</button>`});
  const lastB=blocks(d).at(-1)[0]===h;
  return o+`<div class="rsel"><button class="ghost" onclick="pkOpen(${h},'s')"><small>Entre series</small>⏱ ${mmss(restOf(h))}</button>${lastB?"":`<button class="ghost" onclick="pkOpen(${h},'x')"><small>Entre ejercicios</small>⇢ ${mmss(restExOf(h))}</button>`}</div>`
    +`<div class="btns"><button class="ghost${SE===h?" on":""}" onclick="SE=SE===${h}?-1:${h};render()" aria-expanded="${SE===h}">${SE===h?"Listo":"＋/− Serie"}</button></div>`
    +(SE===h?`<div class="stp"><button class="ghost" onclick="subRow([${b}])" ${n>1?"":"disabled"} aria-label="Quitar una serie">− Quitar</button><b>${n} ${ss?"rondas":"series"}</b><button class="add" onclick="addRow([${b}])" aria-label="Agregar una serie">+ Agregar</button></div>`:"")+`</div>`;
}
function repPanel(i){
  return`<div class="card" style="background:var(--bg);margin:10px 0 0">${ALT.length?`<label style="margin-top:0">Reemplazar «${esc(curEx(i).n)}» por</label><select id="rs">${ALT.map((a,k)=>`<option value="${k}">${esc(a.n)}</option>`).join("")}</select><small class="hint" style="margin-top:10px">¿Aplicar el cambio solo hoy o también en tus próximos entrenamientos?</small><div class="btns"><button class="ghost" onclick="doRep(${i},false)">Solo hoy</button><button class="add" onclick="doRep(${i},true)">Siempre</button></div><button class="ghost" style="margin-top:8px" onclick="rep=-1;render()">Cancelar</button>`:`<small>No hay alternativas con tu equipo. Ajusta el equipo en la pestaña Plan.</small><button class="ghost" style="margin-top:10px" onclick="rep=-1;render()">Cerrar</button>`}</div>`;
}

/* ---------- Selector de descanso (rueda de 0:00 a 5:00 cada 5 s) ---------- */
const PKS=Array.from({length:61},(_,i)=>i*5),IT=52;
let pk=null;
const restTxt=s=>{const m=Math.floor(s/60),x=s%60;return(m?m+" min ":"")+(x||!m?x+" s":"")};
/* kind "s" = entre series (e.rest) · "x" = entre ejercicios (e.rx) */
function pkOpen(h,kind){
  kind=kind||"s";pk={h,kind};const el=$("sh"),k=Math.max(0,PKS.indexOf(Math.round((kind==="x"?restExOf(h):restOf(h))/5)*5)),ti=kind==="x"?"Descanso entre ejercicios":"Descanso entre series";
  el.innerHTML=`<div class="shbg" onclick="pkClose()"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${ti}"><i class="grab"></i><h2>${ti}</h2><small>${esc(curEx(h).n)}${blocks(dayOf(selDay)).find(b=>b[0]===h).length>1?" · superserie":""}${kind==="x"?" → siguiente ejercicio":""}</small>
  <div class="wheel" id="wh" onscroll="pkSc()"><div class="wsp"></div>${PKS.map((s,j)=>`<div class="wo" onclick="pkTo(${j})">${restTxt(s)}</div>`).join("")}<div class="wsp"></div></div>
  <div class="btns"><button class="ghost" onclick="pkStart()">▶ Iniciar</button><button class="add" onclick="pkSave()">Guardar</button></div></div>`;
  el.classList.add("on");$("wh").scrollTop=k*IT;pkSc();
}
const pkIdx=()=>Math.min(PKS.length-1,Math.max(0,Math.round($("wh").scrollTop/IT)));
function pkSc(){if(!$("wh"))return;const k=pkIdx();document.querySelectorAll("#wh .wo").forEach((o,j)=>o.classList.toggle("on",j===k))}
function pkTo(j){$("wh").scrollTo({top:j*IT,behavior:"smooth"})}
function pkClose(){pk=null;$("sh").classList.remove("on");$("sh").innerHTML=""}
function pkSave(){const s=PKS[pkIdx()],e=curEx(pk.h),x=pk.kind==="x";if(x)e.rx=s;else e.rest=s;e.rc=true;sv();svc();pkClose();render();$("m").textContent=(x?"Descanso entre ejercicios":"Descanso entre series")+" de «"+e.n+"»: "+restTxt(s)+"."}
function pkStart(){const s=PKS[pkIdx()];pkClose();if(s>0)tStart("rest",s)}
/* ---- tabla de series: una fila por serie planificada; se guarda al escribir las reps o al valorar el esfuerzo ---- */
const DR={},XR={};   // borradores sin guardar por "ejercicio|fila" y filas extra añadidas con «+ Serie»
/* cambios de ejercicio «solo por hoy»: cfg.ovr = {key: "perfil|fecha|día", m: {índice: ejercicio}}; no tocan el plan */
const ovrKey=k=>prof.cur+"|"+today()+"|"+k;
const ovrOf=k=>cfg.ovr&&cfg.ovr.key===ovrKey(k)?cfg.ovr.m:null;
function dayOf(k){const d=plan.list[k],o=ovrOf(k);return o?{...d,ex:d.ex.map((e,i)=>o[i]||e)}:d}
const curEx=i=>dayOf(selDay).ex[i];
/* sesión anterior (excluye hoy), ordenada por fila */
function prevS(n){const s=hist(n,4).find(s=>s[0].d!==today());return s?s.slice().sort((a,b)=>(a.k??0)-(b.k??0)):null}
/* series de hoy colocadas en su fila (l.k); las antiguas sin fila ocupan los huecos en orden */
function rowsOf(e){
  const td=log.filter(l=>l.ex===e.n&&l.d===today()),R=[];
  td.forEach(l=>{if(l.k!=null&&!R[l.k])R[l.k]=l});
  td.forEach(l=>{if(R[l.k]===l)return;let j=0;while(R[j])j++;R[j]=l});
  return Array.from({length:Math.max(planLen(e),R.length)},(_,j)=>R[j]||null);
}
/* filas previstas de un ejercicio: en una superserie todos sus ejercicios tienen las mismas rondas (las del que más tenga) */
const baseLen=e=>e.s+(XR[e.n]||0);
function blockOf(e){if(!plan)return null;const d=dayOf(selDay),i=d.ex.indexOf(e);return i<0?null:blocks(d).find(b=>b.includes(i)).map(j=>d.ex[j])}
function planLen(e){const b=blockOf(e);return b?Math.max(...b.map(baseLen)):baseLen(e)}
/* fila: en gris (placeholder) va lo que se hizo la última vez en esa serie, aunque fuera otro día (si esta vez hay más
   series, la última registrada); sin historial, el objetivo del plan. Si se guarda sin escribir, se usa eso.
   Las flechas indican si el objetivo del plan (peso/reps) sube o baja respecto a la última vez. */
function rowH(i,j,e,l,pv,R,lab,alt){
  const p=pv&&pv[j],q=p||(pv&&pv[pv.length-1]),dr=DR[e.n+"|"+j]||{};
  const sw=q?q.w:e.w??(e.bw?0:""),sr=q?q.r:e.tr||e.hi;
  const tw=l?l.w:e.w,tr=l?l.r:e.tr;
  const arw=q&&tw!=null&&tw!==q.w?(tw>q.w?ARU:ARD):"",arr=q&&tr!=null&&tr!==q.r?(tr>q.r?ARU:ARD):"";
  return `<div class="srow${l?" done":""}${alt?" alt":""}" id="s${i}_${j}"><b class="sn">${lab||j+1}</b><span class="pv">${p?p.w+" × "+p.r+(p.x?`<i class="dot fx${p.x}"></i>`:""):"—"}</span>`
  +`<input id="w${i}_${j}" type="number" inputmode="decimal" step="0.5" min="0" value="${l?l.w:dr.w??""}" placeholder="${sw}" aria-label="Peso serie ${lab||j+1}" oninput="draft(${i},${j},'w',this.value)" onchange="chW(${i},${j})"><i class="ar${arw===ARD?" dn":""}">${arw}</i>`
  +`<input id="r${i}_${j}" type="number" inputmode="numeric" min="0" value="${l?l.r:dr.r??""}" placeholder="${sr}" aria-label="${e.t?"Segundos":"Repeticiones"} serie ${lab||j+1}" oninput="draft(${i},${j},'r',this.value)" onchange="chR(${i},${j})"><i class="ar${arr===ARD?" dn":""}">${arr}</i>`
  +`<button class="${fxC(l)}" id="f${i}_${j}" onclick="fxTap(${i},${j})" aria-label="Esfuerzo serie ${lab||j+1}: ${l&&l.x?FX[l.x-1]:"sin valorar"}"></button></div>`;
}
/* esfuerzo percibido por serie: l.x = 1 fácil (verde) · 2 medio (amarillo) · 3 difícil (rojo) */
const FX=["fácil","medio","difícil"];
const fxC=l=>"fx"+(l&&l.x?" on fx"+l.x:"");
function draft(i,j,k,v){const key=curEx(i).n+"|"+j;(DR[key]=DR[key]||{})[k]=v}
/* se actualiza la fila en el sitio (sin render) para no quitar el foco del campo que el usuario acaba de tocar */
function updRow(i,j,l){
  const R=$("s"+i+"_"+j),f=$("f"+i+"_"+j);
  if(R)R.classList.toggle("done",!!l);
  if(f){f.className=fxC(l);f.setAttribute("aria-label","Esfuerzo serie "+(j+1)+": "+(l&&l.x?FX[l.x-1]:"sin valorar"))}
}
function chW(i,j){const l=rowsOf(curEx(i))[j],w=parseFloat($("w"+i+"_"+j).value);if(l&&w>=0){l.w=w;sv()}}
function chR(i,j){
  const l=rowsOf(curEx(i))[j],v=$("r"+i+"_"+j).value.trim(),r=parseInt(v,10);
  if(!v||r<1){if(l){log=log.filter(x=>x!==l);sv();updRow(i,j,null);updWeek();updSes()}return}
  if(isNaN(r))return;
  if(l){l.r=r;sv()}else logRow(i,j,r);
}
function logRow(i,j,r,x){
  const e=curEx(i),wi=$("w"+i+"_"+j);let w=parseFloat(wi.value!==""?wi.value:wi.placeholder);
  if(isNaN(w)||w<0){if(!e.bw){say("Anota el peso de la serie "+(j+1)+" de "+e.n+".");return null}w=0}
  unlock();let id=Date.now();while(log.some(l=>l.id===id))id++;
  const l={id,d:today(),ex:e.n,w,r,k:j};if(x)l.x=x;
  if(wi.value==="")wi.value=w;
  log.push(l);sv();delete DR[e.n+"|"+j];updRow(i,j,l);updWeek();updSes();return l;
}
/* semáforo: al tocar el círculo se despliegan las 3 opciones bajo la fila (sin render, para no perder el foco) */
function fxTap(i,j){
  const ex=$("fxp"),same=ex&&ex.dataset.r===i+"_"+j;if(ex)ex.remove();if(same)return;
  const l=rowsOf(curEx(i))[j];
  $("s"+i+"_"+j).insertAdjacentHTML("afterend",`<div class="fxp" id="fxp" data-r="${i}_${j}" role="group" aria-label="Esfuerzo de la serie">${FX.map((n,k)=>`<button class="fxo${l&&l.x===k+1?" on":""}" onclick="setEff(${i},${j},${k+1})"><i class="dot fx${k+1}"></i>${n[0].toUpperCase()+n.slice(1)}</button>`).join("")}${l&&l.x?`<button class="fxo" onclick="setEff(${i},${j},0)" aria-label="Quitar valoración">✕</button>`:""}</div>`);
}
/* elegir el esfuerzo guarda la serie si aún no lo estaba (con lo escrito o lo de la última vez) y arranca el descanso */
function setEff(i,j,x){
  const p=$("fxp");if(p)p.remove();
  let l=rowsOf(curEx(i))[j];const had=!!(l&&l.x);
  if(!l){if(!x)return;const inp=$("r"+i+"_"+j),r=parseInt(inp.value||inp.placeholder,10);if(!(r>=1))return;inp.value=r;l=logRow(i,j,r,x);if(!l)return}
  else{if(x)l.x=x;else delete l.x;sv();updRow(i,j,l)}
  if(x&&!had)afterSet(i);
}
/* «＋/− Serie» abre un selector: agregar o quitar una fila en cada ejercicio del bloque (en superserie, una ronda).
   Solo se quitan filas vacías: una serie ya registrada se borra vaciando sus reps. Vale para la sesión de hoy. */
let SE=-1;
/* siempre por rondas completas: todos los ejercicios del bloque quedan con el mismo número de filas */
function addRow(b){const E=b.map(curEx),len=Math.max(...E.map(e=>rowsOf(e).length));E.forEach(e=>{XR[e.n]=len+1-e.s});render()}
function subRow(b){
  const E=b.map(curEx),len=Math.max(...E.map(e=>rowsOf(e).length));
  if(len<=1)return;
  if(E.some(e=>rowsOf(e)[len-1])){render();$("m").textContent=(b.length>1?"La última ronda":"La última serie")+" ya tiene series registradas. Para quitarla, borra sus reps.";return}
  E.forEach(e=>{XR[e.n]=len-1-e.s;delete DR[e.n+"|"+(len-1)]});render();
}
const say=t=>{$("m").textContent=t;if(!clk.mode){clk.note=t;tUI()}};
/* tras valorar una serie: en superserie se pasa al siguiente sin descanso; si el bloque (ejercicio o superserie) quedó
   completo, descanso entre ejercicios; si no, descanso entre series */
function afterSet(i){
  const d=dayOf(selDay),e=d.ex[i],nx=e.ss&&d.ex[i+1];
  if(nx){say("Superserie: ahora «"+nx.n+"», sin descanso.");return}
  const B=blocks(d),b=B.find(x=>x.includes(i)),h=b[0],done=b.every(j=>rowsOf(d.ex[j]).every(Boolean)),last=B.indexOf(b)===B.length-1;
  if(done&&last){say("¡Último ejercicio terminado! Pulsa ■ Fin para guardar la sesión.");return}
  const nb=done&&B[B.indexOf(b)+1],t=done?"Descanso entre ejercicios · sigue «"+d.ex[nb[0]].n+"»":h<i?"Ronda completa · descansa y vuelve a «"+d.ex[h].n+"»":"Descanso entre series",rs=done?restExOf(h):restOf(h);
  if(cfg.auto&&rs>0)tStart("rest",rs,null,t);else say(t);
}
function tgSS(i){const e=curEx(i),nx=curEx(i+1);e.ss=!e.ss;if(e.ss&&nx)e.s=nx.s=Math.max(e.s,nx.s);sv();svc();render()}
function del(id){log=log.filter(l=>l.id!==id);sv();render()}
function openRep(i){
  const d=dayOf(selDay),e=d.ex[i],used=d.ex.map(x=>x.n);
  ALT=[];
  [e.c,...Object.keys(SL).filter(c=>c!==e.c&&GRP[c]===GRP[e.c])].forEach(c=>SL[c].forEach(n=>{
    if(!used.includes(n)&&!ALT.some(a=>a.n===n)&&EX[n].q.every(q=>plan.eq.includes(q)))ALT.push({n,c});
  }));
  rep=i;render();
}
/* perm = true: cambia la rutina (también los próximos entrenamientos); false: solo la sesión de hoy */
function doRep(i,perm){
  const a=ALT[+$("rs").value];if(!a)return;
  const o=curEx(i),ne={...mk(a.n,a.c,plan.goal,plan.lv,plan.time,plan.mode,false,o.tier),f:!!o.f,ss:!!o.ss,rest:o.rest,rx:o.rx,rc:o.rc};
  if(perm){plan.list[selDay].ex[i]=ne;const ov=ovrOf(selDay);if(ov)delete ov[i];sv()}
  else{if(!ovrOf(selDay))cfg.ovr={key:ovrKey(selDay),m:{}};cfg.ovr.m[i]=ne}
  svc();rep=-1;render();
  $("m").textContent=perm?"Ejercicio cambiado en tu rutina: se mantiene en los próximos entrenamientos.":"Cambiado solo por hoy. La próxima vez vuelve «"+plan.list[selDay].ex[i].n+"».";
}

function vRev(){
  if(!plan)return '<div class="card empty">Primero genera tu plan en la pestaña Plan.</div>';
  return `<div class="card"><h2>Revisión de la semana ${wk()+1}</h2><small>Analiza tus últimas 3 sesiones de cada ejercicio. Sube el peso (o pasa a la siguiente progresión) si completaste todas las series en el tope del rango; si no, mantén y suma repeticiones. Si llevas 3 sesiones sin mejorar o bajando, te propone una descarga.</small></div>`
  +plan.list.map(d=>`<div class="card"><h2>${esc(d.name)}</h2>${d.ex.map(e=>{const r=rec(e),t=trend(e);return `<div class="item"><div><b>${esc(e.n)}</b> <span class="chip ${r.k}">${r.t}</span><br><small>${esc(r.m)}</small>`
    +(t?`<br><small class="${t.p>1?"up":t.p<-1?"down":"hold"}">Tendencia (${t.n} sesiones): ${t.p>1?"↑":t.p<-1?"↓":"→"} ${t.p>0?"+":""}${t.p.toFixed(1)}%</small>`:"")
    +(r.k!=="new"?`<br><small>Próxima semana: <b>${esc(nextTxt(e,r))}</b></small>`:"")+`</div></div>`}).join("")}</div>`).join("")
  +`<button class="add" onclick="apply()">Aplicar a la próxima semana</button>`;
}
function apply(){
  let ch=0;
  plan.list.forEach(d=>d.ex.forEach((e,i)=>{
    const r=rec(e);if(r.k==="new")return;
    const sw=r.nx||r.pv;
    if(sw&&!d.ex.some(x=>x.n===sw)){d.ex[i]={...mk(sw,e.c,plan.goal,plan.lv,plan.time,plan.mode,false,e.tier),f:!!e.f,s:e.s,ss:!!e.ss,tr:r.r};ch++;return}
    if(r.w!=null)e.w=r.w;e.tr=r.r??null;
  }));
  sv();render();$("m").textContent="Pesos y repeticiones objetivo actualizados"+(ch?" · "+ch+" ejercicio(s) cambiaron de progresión":"")+".";
}

function vProg(){
  const ns=[...new Set(log.map(l=>l.ex))].sort();
  if(!ns.length)return '<div class="card empty">Registra tu primera serie para ver tu progreso.</div>';
  if(!ns.includes(selEx))selEx=ns[0];
  const data=log.filter(l=>l.ex===selEx),z=data.every(l=>l.w===0),val=l=>z?l.r:l.w,mx=Math.max(...data.map(val)),by={},ru=EX[selEx]&&EX[selEx].t?" s":" reps";
  data.forEach(l=>(by[l.d]=by[l.d]||[]).push(l));
  const days=Object.keys(by).sort(),pts=days.map(d=>Math.max(...by[d].map(val)));
  let ch='<div class="empty">El gráfico aparece con 2 o más días</div>';
  if(days.length>1){
    const W=300,H=110,p=14,mn=Math.min(...pts),hi=Math.max(...pts),rg=hi-mn||1;
    const xy=pts.map((v,i)=>[p+i*(W-2*p)/(pts.length-1),H-p-(v-mn)/rg*(H-2*p)]);
    ch=`<svg class="chart" viewBox="0 0 ${W} ${H}"><polyline fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linejoin="round" points="${xy.map(a=>a.join(",")).join(" ")}"/>${xy.map(a=>`<circle cx="${a[0]}" cy="${a[1]}" r="3.5" fill="var(--ac)"/>`).join("")}</svg>`;
  }
  return `<div class="card"><label style="margin-top:0">Ejercicio</label><select onchange="selEx=this.value;render()">${ns.map(n=>`<option ${n===selEx?"selected":""}>${esc(n)}</option>`).join("")}</select>
  <div class="stats"><div><b>${mx}${z?ru:" "+UN()}</b><span>${z?"Mejor serie":"Peso máx."}</span></div><div><b>${z?data.reduce((a,l)=>a+l.r,0):Math.round(Math.max(...data.map(l=>l.w*(1+l.r/30))))}${z?"":" "+UN()}</b><span>${z?(ru===" s"?"Segundos totales":"Reps totales"):"1RM estimado"}</span></div><div><b>${data.length}</b><span>Series</span></div></div>${ch}</div>
  <div class="card"><h2>Historial</h2>${days.slice().reverse().map(d=>`<div style="margin-bottom:8px"><small>${fmt(d)}</small>${by[d].map(l=>`<div class="item"><div>${l.w} ${UN()} × ${l.r}${l.x?`<span class="dot fx${l.x}" title="${FX[l.x-1]}"></span>`:""}${val(l)===mx?'<span class="pr">PR</span>':""}</div><button class="del" onclick="del(${l.id})" aria-label="Borrar">×</button></div>`).join("")}</div>`).join("")}</div>`;
}

function unlock(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume()}catch(e){}}
/* pitido corto de la cuenta atrás */
function pip(){
  if(!cfg.snd)return;
  try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}
  try{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.frequency.value=740;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.12);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.13)}catch(e){}
}
function beep(n){
  if(!cfg.snd)return;
  try{navigator.vibrate&&navigator.vibrate(n>2?[250,120,250,120,250]:[250,120,250])}catch(e){}
  try{for(let k=0;k<n;k++){const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+k*.28;o.frequency.value=k===n-1?1175:880;g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.24)}}catch(e){}
}
function tStart(mode,sec,fill,note){unlock();sec=Math.max(1,Math.round(sec));clk={mode,dur:sec,end:Date.now()+sec*1000,fill:fill||null,note:note||(mode==="rest"?"Descanso":"Ejercicio")};tUI()}
function tAdd(s){if(!clk.mode)return;clk.end=Math.max(Date.now()+1000,clk.end+s*1000);clk.dur=Math.max(1,clk.dur+s);tick()}
function tStop(){clk.mode=null;clk.note="";tUI()}
function tick(){
  if(!clk.mode)return;
  const l=left(),T=$("tT"),B=$("tP");
  if(T)T.textContent=mmss(l);if(B)B.style.width=(100-l/clk.dur*100)+"%";
  if(clk.mode==="rest"&&l>0&&l<=5&&clk.pip!==l){clk.pip=l;pip()}   // cuenta atrás audible: un pitido por segundo en los últimos 5
  if(l>0)return;
  if(clk.mode==="work"&&wuNext())return;
  if(clk.mode==="work"){
    const f=clk.fill;
    beep(2);clk.mode=null;clk.note="Tiempo de ejercicio cumplido";
    if(f){const r=$("r"+f[0]+"_"+f[1]);if(r&&!r.value){r.value=clk.dur;chR(f[0],f[1])}}
    else if(cfg.auto){tStart("rest",restSec(),null,"Tiempo cumplido · descanso");return}
  }else{beep(3);clk.mode=null;clk.note="¡Descanso terminado! A por la siguiente serie"}
  tUI();
}

  <div class="tbs"><button onclick="tStart('work',cfg.work)">Ejercicio</button><button onclick="tStart('rest',restSec())">Descanso</button>${clk.mode?'<button class="sm" onclick="tAdd(-15)" aria-label="Quitar 15 segundos">−15</button><button class="sm" onclick="tAdd(15)" aria-label="Añadir 15 segundos">+15</button><button class="sm" onclick="tStop()" aria-label="Detener">■</button>':""}<button class="sm" onclick="tOpen=!tOpen;tUI()" aria-label="Ajustes del temporizador">⚙</button></div>
  ${tOpen?`<div class="row" style="margin-top:4px"><div><label>Ejercicio (s)</label><input type="number" inputmode="numeric" min="5" step="5" value="${cfg.work}" onchange="cfg.work=Math.max(5,+this.value||40);svc();tUI()"></div><div><label>Descanso (s)</label><input type="number" inputmode="numeric" min="0" step="15" value="${cfg.rest||""}" placeholder="60" onchange="cfg.rest=Math.max(0,+this.value||0);svc();tUI()"></div></div>
  <small class="hint">Descanso del botón «Descanso». Cada ejercicio tiene el suyo (entre series y entre ejercicios), 1:00 por defecto: se cambia al final de su tarjeta.</small>
  <label class="ck"><input type="checkbox" ${cfg.auto?"checked":""} onchange="cfg.auto=this.checked;svc()">Iniciar el descanso al registrar una serie</label>
  <label class="ck"><input type="checkbox" ${cfg.snd?"checked":""} onchange="cfg.snd=this.checked;svc()">Sonido y vibración al terminar</label>
  <label class="ck"><input type="checkbox" ${cfg.wake?"checked":""} onchange="setWake(this.checked)">Mantener la pantalla encendida</label>
  <small class="hint" id="wkS">${wakeTxt()}</small>`:""}</div>`;
  document.querySelector("main").style.paddingBottom=on?(el.offsetHeight+16)+"px":"";
  tick();
}

function render(){
  $("m").textContent="";
  for(let i=1;i<=4;i++)$("t"+i).classList.toggle("on",i===tab);
  $("v").innerHTML=[vPlan,vTrain,vRev,vProg][tab-1]();
  $("pfb").textContent="👤 "+pName()+" ▾";$("pf").innerHTML=pOpen?vProf():"";
  updWeek();tUI();
}
/* al volver a la app otro día, la semana y el día que toca se ponen al día solos */
let lastDay=today();
document.addEventListener("visibilitychange",()=>{if(document.hidden||today()===lastDay)return;lastDay=today();vDay=null;rep=-1;render()});
/* estado inicial de la vista para el perfil activo: abre el entrenamiento que toca hoy */
function boot(){
  if(plan&&plan.list.some(d=>d.ex.some(e=>!EX[e.n])))plan=null;
  /* descansos generados por versiones anteriores (no elegidos a mano con la rueda) pasan al predeterminado de 1 min */
  if(plan&&!plan.r60){plan.list.forEach(d=>d.ex.forEach(e=>{if(!e.rc)e.rest=REST0}));plan.r60=true;sv()}
  selDay=0;rep=-1;edit=false;selEx="";tab=1;vDay=null;SE=-1;
  for(const k in DR)delete DR[k];for(const k in XR)delete XR[k];
  if(plan){const k=actK();selDay=k>=0?k:0;tab=2}
}
/* ---------- Perfiles ---------- */
const pName=()=>(prof.list.find(p=>p.id===prof.cur)||prof.list[0]).n;
function vProf(){
  return`<div class="card"><h2>Perfiles</h2><small>Cada perfil tiene su propio plan, historial y progreso. Puedes tener hasta 3.</small>`
  +prof.list.map(p=>pDel===p.id
    ?`<div class="pfr" style="flex-wrap:wrap"><small style="flex-basis:100%;color:var(--er)">¿Eliminar «${esc(p.n)}» con su plan y todo su historial? No se puede deshacer.</small><button class="add" style="background:var(--er);margin:0;flex:1" onclick="delProf('${p.id}')">Eliminar</button><button class="ghost" style="flex:1" onclick="pDel='';render()">Cancelar</button></div>`
    :`<div class="pfr"><input value="${esc(p.n)}" maxlength="20" aria-label="Nombre del perfil" onchange="renProf('${p.id}',this.value)">${p.id===prof.cur?'<button class="ghost on" disabled>Activo</button>':`<button class="ghost" onclick="swProf('${p.id}')">Usar</button>`}${prof.list.length>1?`<button class="ghost" onclick="pDel='${p.id}';render()" aria-label="Eliminar perfil">🗑</button>`:""}</div>`).join("")
  +(prof.list.length<3?`<button class="ghost" style="margin-top:8px" onclick="addProf()">+ Nuevo perfil</button>`:"")
  +`<div class="pfr" style="margin-top:8px"><span style="flex:1">Unidad de peso de «${esc(pName())}»</span><button class="ghost${UN()==="lb"?" on":""}" onclick="setUnit('lb')">lb</button><button class="ghost${UN()==="kg"?" on":""}" onclick="setUnit('kg')">kg</button></div>`
  +`<small class="hint">Al cambiar de unidad se convierten tus pesos guardados.${curP().cv?"":` Si los pesos que ya anotaste eran kilos, <a href="#" onclick="cvKg();return false">conviértelos a libras</a>.`}</small>`
  +vBackup()+`</div>`;
}
/* ---------- Copia de seguridad: todos los datos de la app (claves «gym…»: perfiles, planes, historial, ajustes) ---------- */
let BKP=null;   // copia leída, pendiente de confirmar
function bkData(){const data={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith("gym"))data[k]=localStorage.getItem(k)}}catch(e){}return JSON.stringify({app:"gym-tracker",v:1,date:new Date().toISOString(),data})}
function vBackup(){
  return`<div class="bk"><h2>Copia de seguridad</h2><small>Guarda todos tus perfiles, planes e historial, o pásalos a otro celular o a la app instalada.</small>
  <div class="btns">${ownHost()?`<button class="ghost" onclick="bkExport()">⬇ Exportar archivo</button>`:""}<button class="ghost" onclick="bkCopy()">📋 Copiar datos</button></div>
  <label class="ghost bkf">⬆ Importar archivo<input type="file" accept="application/json,.json" onchange="bkFile(this)"></label>
  <textarea id="bkT" rows="2" placeholder="…o pega aquí los datos copiados"></textarea><button class="ghost" style="margin-top:6px" onclick="bkLoad($('bkT').value)">Importar texto pegado</button>
  ${BKP?`<div class="card" style="background:var(--bg);margin:10px 0 0;border-color:var(--wa)"><b>¿Reemplazar los datos de este dispositivo?</b><br><small>Copia del ${new Date(BKP.date).toLocaleString("es")} con ${Object.keys(BKP.data).length} elementos. Lo que haya ahora en este dispositivo se sustituye.</small><div class="btns"><button class="add" style="background:var(--wa)" onclick="bkApply()">Sí, importar</button><button class="ghost" onclick="BKP=null;render()">Cancelar</button></div></div>`:""}</div>`;
}
function bkShow(){const t=$("bkT");if(t){t.value=bkData();t.focus();t.select()}}
/* ¿se sirve desde su propio sitio (GitHub Pages, localhost) y no dentro de claude.ai, donde no hay descargas? */
const ownHost=()=>{const h=location.hostname;return(location.protocol==="https:"&&!/claude|anthropic/.test(h))||h==="localhost"||h==="127.0.0.1"};
function bkExport(){
  if(!ownHost())return bkCopy();   // dentro de claude.ai las descargas están bloqueadas: se copian los datos
  try{const n="gym-tracker-"+today()+".json",a=document.createElement("a");a.href=URL.createObjectURL(new Blob([bkData()],{type:"application/json"}));a.download=n;document.body.appendChild(a);a.click();a.remove();$("m").textContent="Copia guardada: "+n+" (en Descargas)."}
  catch(e){bkShow();$("m").textContent="No se pudo descargar: copia el texto del recuadro."}
}
async function bkCopy(){try{await navigator.clipboard.writeText(bkData());$("m").textContent="Datos copiados. En la otra app: 👤 → Copia de seguridad → pega e «Importar texto pegado»."}catch(e){bkShow();$("m").textContent="Mantén pulsado el texto seleccionado del recuadro y elige Copiar."}}
function bkFile(inp){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>bkLoad(r.result);r.readAsText(f)}
function bkLoad(txt){let o=null;try{o=JSON.parse(txt)}catch(e){}if(!o||o.app!=="gym-tracker"||!o.data){$("m").textContent="Eso no es una copia de Gym Tracker.";return}BKP=o;render()}
function bkApply(){
  try{Object.keys(localStorage).filter(k=>k.startsWith("gym")).forEach(k=>localStorage.removeItem(k));Object.entries(BKP.data).forEach(([k,v])=>localStorage.setItem(k,v))}catch(e){$("m").textContent="No se pudo guardar en este navegador.";return}
  location.reload();
}
const curP=()=>prof.list.find(p=>p.id===prof.cur)||prof.list[0];
/* multiplica todos los pesos guardados del perfil (historial y objetivos del plan) */
function convW(f){log.forEach(l=>{if(l.w)l.w=Math.round(l.w*f*2)/2});if(plan)plan.list.forEach(d=>d.ex.forEach(e=>{if(e.w)e.w=rnd(e.w*f)}));sv()}
function setUnit(u){const p=curP();if(UN()===u)return;p.u=u;p.cv=true;svp();convW(u==="lb"?2.20462:1/2.20462);render();$("m").textContent="Pesos convertidos a "+(u==="lb"?"libras":"kilos")+"."}
function cvKg(){const p=curP();p.u="lb";p.cv=true;svp();convW(2.20462);render();$("m").textContent="Tus pesos anteriores se convirtieron de kilos a libras."}
function swProf(id){prof.cur=id;svp();log=ld(kOf(K1,id),[]);plan=ld(kOf(K2,id),null);durs=ld(kOf(KD,id),[]);notes=ld(kOf(KN,id),{});pOpen=false;pDel="";boot();render();scrollTo(0,0);$("m").textContent="Perfil: "+pName()+".";}
function addProf(){if(prof.list.length>=3)return;const id=PIDS.find(x=>!prof.list.some(p=>p.id===x));prof.list.push({id,n:"Perfil "+(PIDS.indexOf(id)+1),u:"lb",cv:true});swProf(id);$("m").textContent="Perfil nuevo creado. Ponle nombre arriba y genera su plan.";}
function renProf(id,n){const p=prof.list.find(x=>x.id===id);n=n.trim().slice(0,20);if(p&&n){p.n=n;svp();$("pfb").textContent="👤 "+pName()}}
function delProf(id){
  if(prof.list.length<2)return;
  try{[K1,K2,KD,KN].forEach(k=>localStorage.removeItem(kOf(k,id)))}catch(e){}
  prof.list=prof.list.filter(p=>p.id!==id);pDel="";
  if(prof.cur===id)swProf(prof.list[0].id);else{svp();render()}
}
/* ---------- App instalable (PWA): solo cuando se sirve desde su propio sitio (GitHub Pages o localhost).
   El service worker (sw.js) busca siempre la versión nueva en la red y usa la copia guardada sin conexión. ---------- */
(function(){
  if(!ownHost())return;
  const add=(t,a)=>{const e=document.createElement(t);Object.assign(e,a);document.head.appendChild(e)};
  add("link",{rel:"manifest",href:"manifest.webmanifest"});
  add("meta",{name:"theme-color",content:"#0a0a0b"});
  add("link",{rel:"apple-touch-icon",href:"icons/icon-192.png"});
  add("meta",{name:"apple-mobile-web-app-capable",content:"yes"});
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
boot();
render();
</script>
</body>
</html>
